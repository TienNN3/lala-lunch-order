<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaLa Lunch – Đặt cơm nhóm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥗%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f1;--surface:#fff;--surface2:#f6faf4;--ink:#16301f;--muted:#64796b;--line:#e1ebdf;
  --green:#1f9d55;--green-d:#157a41;--green-l:#e3f5ea;--lime:#a6d948;--orange:#f59e0b;--red:#e5484d;--sky:#2b8cd6;
  --shadow:0 1px 2px rgba(22,48,31,.06),0 8px 24px rgba(22,48,31,.07);--r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1712;--surface:#16231b;--surface2:#1b2b21;--ink:#e8f3ea;--muted:#8fa797;--line:#26382d;--green:#3dc476;--green-d:#2fa862;--green-l:#173a26;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme=dark]{--bg:#0e1712;--surface:#16231b;--surface2:#1b2b21;--ink:#e8f3ea;--muted:#8fa797;--line:#26382d;--green:#3dc476;--green-d:#2fa862;--green-l:#173a26;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#14532d,#1f9d55);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .logo{width:42px;height:42px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px}
.brand b{display:block;font-size:17px;letter-spacing:-.2px}.brand small{opacity:.8;font-size:12px}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:500;opacity:.88}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button.on{background:#fff;color:#14532d;opacity:1;font-weight:700}
.nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.nav i{font-style:normal;width:22px;text-align:center}
.side-foot{margin-top:auto;font-size:12px;opacity:.85;padding:10px;background:rgba(255,255,255,.12);border-radius:12px}
main{padding:26px 30px 60px;max-width:1280px;width:100%}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:26px;letter-spacing:-.5px;font-weight:800}
.sub{color:var(--muted);margin-top:2px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--green-l);color:var(--green-d)}
.pill.warn{background:#fff4dc;color:#a15c00}.pill.bad{background:#ffe5e6;color:#b4232a}.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700}.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi{display:flex;flex-direction:column;gap:2px}.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.8px}.kpi .s{font-size:12px;color:var(--muted)}
.kpi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--green-l);font-size:18px;margin-bottom:8px}
.btn{border:0;background:var(--green);color:#fff;padding:9px 15px;border-radius:11px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--green-d)}.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--green-l)}
.btn.danger{background:transparent;color:var(--red);padding:5px 8px}.btn.sm{padding:6px 10px;font-size:13px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:60px}label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:center;line-height:1.25;font-weight:600}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}.chip.on small{color:#e8fff0}
.chip .n{display:inline-block;margin-left:4px;background:var(--green-l);color:var(--green-d);border-radius:99px;padding:0 7px;font-size:11.5px}.chip.on .n{background:rgba(255,255,255,.25);color:#fff}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s}
.dish:hover{transform:translateY(-2px)}
.dish .ph{aspect-ratio:4/3;background:linear-gradient(135deg,#bfe8cb,#e8f7c9);position:relative;overflow:hidden}
.dish .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dish .tag{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.92);color:#14532d}
.dish .tag.chay{background:#e5f8c9;color:#3b6d0a}.dish .cnt{position:absolute;right:10px;top:10px;background:#14532d;color:#fff;font-weight:800;border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-size:13px;padding:0 8px}
.dish .bd{padding:12px 13px 14px;display:flex;flex-direction:column;gap:8px;flex:1}.dish .nm{font-weight:700;line-height:1.3}.dish .meal{font-size:12px;color:var(--muted)}
.dish.sel{outline:3px solid var(--green)}.dish.empty{opacity:.55}
.dish .btn{margin-top:auto;justify-content:center}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}.tw{overflow-x:auto}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.bar .t{width:42%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .b{flex:1;background:var(--surface2);border-radius:99px;height:10px;overflow:hidden}.bar .b i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime));border-radius:99px}.bar .c{width:22px;text-align:right;font-weight:700}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden;padding:0;background:linear-gradient(120deg,#14532d,#1f9d55 60%,#6fbf3a);color:#fff;border:0}
.hero .tx{padding:24px}.hero h2{font-size:22px;margin:6px 0 10px;color:#fff}.hero .m{display:flex;flex-direction:column;gap:6px;font-size:14px}.hero .m span{background:rgba(255,255,255,.14);padding:7px 11px;border-radius:11px}
.hero .im{min-height:200px;background-size:cover;background-position:center}
.hero .pill{background:rgba(255,255,255,.2);color:#fff}
.menu-img{width:100%;border-radius:14px;border:1px solid var(--line);display:block;cursor:zoom-in}
.pack{display:flex;flex-direction:column;gap:6px}.pack .pr{font-size:24px;font-weight:800}.pack .kc{font-weight:700;color:var(--green-d)}
.empty-s{color:var(--muted);text-align:center;padding:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#14532d;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow)}.toast.on{opacity:1;transform:translateX(-50%)}
dialog{border:0;border-radius:18px;padding:0;max-width:min(92vw,900px);background:var(--surface);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.6)}dialog img{max-width:100%;max-height:90vh;display:block}
pre.msg{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font:inherit;font-size:13.5px;margin:0 0 10px}
.credit{font-size:12px;color:var(--muted)}.credit a{color:var(--green-d)}
.menu-in{min-width:120px;font-size:13px;padding:7px 9px}
.mobtop{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px;z-index:20;border-radius:18px 18px 0 0;gap:2px}
  .brand,.side-foot{display:none}.nav{display:flex;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:0;font-size:10.5px;padding:6px 4px;text-align:center;justify-content:center;align-items:center}
  main{padding:16px 16px 100px}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .im{min-height:150px;order:-1}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">🥗</div><div><b>LaLa Lunch</b><small>Đặt cơm nhóm</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="syncState">Lưu trên trình duyệt</div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><img id="dlgImg" alt=""></dialog>

<script src="dish-art.js"></script>
<script>
/* ====================== DỮ LIỆU CỐ ĐỊNH (từ file Excel) ====================== */
const PACKS={
  'Standard Healthy':{alias:'Đốt mỡ',goal:'Ăn kiêng, giảm cân',kcal:'525–565',gift:'10 ngày: nước detox · 15 ngày: hũ trứng ngâm tương · 20 ngày: set snack healthy',single:65,icon:'🥬'},
  'High Protein':{alias:'Giữ dáng',goal:'Giữ dáng, tăng năng lượng, ăn no',kcal:'625–670',gift:'Đặt 2 tuần + bình luận: tặng trà sáng da',single:90,icon:'🍗'},
  'Super Protein':{alias:'Tăng cơ',goal:'Tăng cơ, đốt mỡ, vận động nhiều',kcal:'750–850',gift:'Đặt 2 tuần + bình luận: tặng trà sáng da',single:115,icon:'💪'}
};
// [gói, bữa, số ngày] -> tổng (k, đã gồm ship)
const PRICE={
 'Standard Healthy|Trưa|5':335,'Standard Healthy|Trưa|10':670,'Standard Healthy|Trưa|15':1005,'Standard Healthy|Trưa|20':1340,
 'Standard Healthy|Trưa + Tối|5':610,'Standard Healthy|Trưa + Tối|10':1220,'Standard Healthy|Trưa + Tối|15':1830,'Standard Healthy|Trưa + Tối|20':2440,
 'High Protein|Trưa|5':445,'High Protein|Trưa + Tối|5':835,'Super Protein|Trưa|5':575,'Super Protein|Trưa + Tối|5':1050};
const PRICE_ROWS=Object.entries(PRICE).map(([k,v])=>{const [p,m,d]=k.split('|');return{p,m,d:+d,v}});
const DAYS=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const SLOT_DEF=[{k:'vc',kind:'Chay',meal:'Trưa'},{k:'vt',kind:'Chay',meal:'Tối'},{k:'mc',kind:'Mặn',meal:'Trưa'},{k:'mt',kind:'Mặn',meal:'Tối'}];
// Ảnh món: ưu tiên ảnh thật images/dishes/<slug>.jpg (nếu bạn đã thả vào), nếu chưa có thì dùng ảnh minh hoạ SVG (dish-art.js)
const slug=n=>(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const realOk=new Set();
function imgFor(name){const k=slug(name);return realOk.has(k)?'images/dishes/'+k+'.jpg':dishArt(name)}
function probeImages(){let hit=false,left=0;const all=new Set();Object.values(S.menu).forEach(m=>Object.values(m).forEach(v=>v&&all.add(v)));
  all.forEach(n=>{const k=slug(n);if(realOk.has(k))return;left++;const i=new Image();i.onload=()=>{realOk.add(k);hit=true;if(--left===0&&hit)render()};i.onerror=()=>{if(--left===0&&hit)render()};i.src='images/dishes/'+k+'.jpg'})}

/* ====================== TRẠNG THÁI & LƯU TRỮ ====================== */
const KEY='lala-order-v1';
const MENU0={
 '2026-11-09':{vc:'Nui trộn ngũ sắc',vt:'Cơm lứt phù trúc xào sả ớt kèm đậu',mc:'Miến trộn kèm bò sốt tiêu đen',mt:'Cơm lứt chả rim trứng cút'},
 '2026-11-10':{vc:'Cơm lứt nấm đậu xào lăn',vt:'Bánh canh nấm rau củ (món nước)',mc:'Cơm lứt thịt ghim nước dừa',mt:'Khoai ngọt kèm má đùi gà sốt mật ong'},
 '2026-11-11':{vc:'Mì Quảng trộn thập cẩm',vt:'Cơm lứt kèm tempeh lúc lắc',mc:'Salad cá ngừ sốt dầu giấm',mt:'Cơm lứt heo xào sả ớt'},
 '2026-11-12':{vc:'Cơm Dương Châu ngũ sắc',vt:'Bánh hỏi kèm nấm nướng',mc:'Cơm đậu xanh cá sapa nướng sate',mt:'Mì ý gà sốt kem nấm'},
 '2026-11-13':{vc:'Bẩu xì dùn',vt:'Cơm lứt gỏi nấm',mc:'Bún lứt gà nướng Teriyaki',mt:'Cơm lứt heo sốt Thái'},
 '2026-11-16':{},'2026-11-17':{},'2026-11-18':{},'2026-11-19':{},'2026-11-20':{}};
let _id=0;const uid=()=>Date.now().toString(36)+(_id++).toString(36)+Math.random().toString(36).slice(2,5);
const o=(date,name,dish,note='')=>({id:uid(),date,name,dish,note});
function seed(){
  const m12=MENU0['2026-11-12'],m13=MENU0['2026-11-13'];
  return{updatedAt:0,
   settings:{contact:'',phone:'',address:'',time:'11:30',start:'2026-11-12',kitchen:'LaLa Salad – Healthy Food',kitchenPhone:'0919 997 923'},
   menu:MENU0,
   combos:[
    {id:uid(),name:'Đậu',pack:'Standard Healthy',kind:'Chay',meal:'Trưa',days:20,note:'Ăn chay có trứng, không dưa leo',paid:false},
    {id:uid(),name:'Nhung',pack:'Standard Healthy',kind:'Mặn',meal:'Trưa',days:20,note:'',paid:false},
    {id:uid(),name:'Dĩm',pack:'Standard Healthy',kind:'Mặn',meal:'Trưa',days:5,note:'Thứ 5: tối · Thứ 6: trưa',paid:false},
    {id:uid(),name:'Nghị',pack:'Standard Healthy',kind:'Mặn',meal:'Trưa',days:5,note:'Thứ 5: tối · Thứ 6: tối',paid:false},
    {id:uid(),name:'Tiến',pack:'Standard Healthy',kind:'Mặn',meal:'Trưa',days:5,note:'Không ăn các món thịt xá xíu',paid:false},
    {id:uid(),name:'Jee',pack:'Standard Healthy',kind:'Mặn',meal:'Trưa',days:2,note:'T5, T6: menu bữa trưa',paid:false},
    {id:uid(),name:'Mễ',pack:'Standard Healthy',kind:'Mặn',meal:'Trưa',days:5,note:'Không ăn các món thịt xá xíu',paid:false},
    {id:uid(),name:'Ngân',pack:'High Protein',kind:'Mặn',meal:'Trưa',days:5,note:'Giống Tiến, không ăn cay',paid:false}],
   orders:[
    o('2026-11-12','Đậu',m12.vt),o('2026-11-12','Nhung',m12.mt,'off'),o('2026-11-12','Dĩm',m12.mt),o('2026-11-12','Nghị',m12.mt),
    o('2026-11-12','Jee',m12.mc),o('2026-11-12','Tiến',m12.vc),o('2026-11-12','Mễ',m12.mc),o('2026-11-12','Ngân',m12.mc),
    o('2026-11-13','Đậu',m13.vt),o('2026-11-13','Nhung',m13.mc),o('2026-11-13','Dĩm',m13.mc),o('2026-11-13','Nghị',m13.mt),
    o('2026-11-13','Jee',m13.mc),o('2026-11-13','Tiến',m13.mt,'xin ớt trái'),o('2026-11-13','Mễ',m13.mt),o('2026-11-13','Ngân',m13.mt)]};
}
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);delete S.settings?.cloudUrl;return}}catch(e){}S=seed()}
const API='https://lala-lunch-sync.fan-made.workers.dev/api/state';
const TOKEN_KEY='lala-cloud-token';
const token=()=>localStorage.getItem(TOKEN_KEY)||'';
const clone=x=>structuredClone(x);
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function mergeValue(base,local,remote){
  if(same(local,base))return clone(remote);
  if(same(remote,base))return clone(local);
  if(Array.isArray(local)&&Array.isArray(remote)&&local.every(x=>x&&typeof x==='object'&&'id'in x)&&remote.every(x=>x&&typeof x==='object'&&'id'in x)){
    const b=new Map((base||[]).map(x=>[x.id,x])),l=new Map(local.map(x=>[x.id,x])),r=new Map(remote.map(x=>[x.id,x]));
    return [...new Set([...r.keys(),...l.keys()])].map(id=>mergeValue(b.get(id),l.get(id),r.get(id))).filter(x=>x!==undefined);
  }
  if(local&&remote&&typeof local==='object'&&typeof remote==='object'&&!Array.isArray(local)&&!Array.isArray(remote)){
    const out={};for(const k of new Set([...Object.keys(base||{}),...Object.keys(local),...Object.keys(remote)])){
      const v=mergeValue(base?.[k],local[k],remote[k]);if(v!==undefined)out[k]=v;
    }return out;
  }
  return local===undefined?undefined:clone(local);
}
let pushT,revision=null,baseState=null,dirty=false,pushRunning=false;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  dirty=true;clearTimeout(pushT);if(token())pushT=setTimeout(cloudPush,600);
}
/* ---- Đồng bộ nhóm qua Cloudflare Worker + D1 ---- */
let cloudState='off';
function setSync(t,s){cloudState=s;const e=document.getElementById('syncState');if(e)e.textContent=t}
const headers=()=>({'Authorization':'Bearer '+token(),'Content-Type':'application/json'});
async function cloudPush(){
  if(!token()||pushRunning||!dirty)return false;
  if(revision===null)return await cloudPull(true);
  pushRunning=true;
  try{
    for(let attempt=0;attempt<3&&dirty;attempt++){
      setSync('Đang đồng bộ…','busy');const sent=clone(S);
      const r=await fetch(API,{method:'PUT',headers:headers(),body:JSON.stringify({revision,state:sent})});
      const d=await r.json();
      if(r.status===409){S=mergeValue(baseState||{},S,d.state||{});revision=d.revision;baseState=clone(d.state||{});dirty=!same(S,d.state);localStorage.setItem(KEY,JSON.stringify(S));render();continue}
      if(!r.ok)throw new Error(d.error||'Lỗi đồng bộ');
      revision=d.revision;baseState=sent;dirty=!same(S,sent);
    }
    if(dirty)throw new Error('Dữ liệu vừa thay đổi, đang thử lại');
    setSync('☁️ Đã đồng bộ','ok');return true;
  }catch(e){setSync('⚠️ '+e.message+' (đã lưu trên máy)','err');setTimeout(cloudPush,5000);return false}
  finally{pushRunning=false}
}
async function cloudPull(first){
  if(!token()){setSync('💾 Nhập mã nhóm để đồng bộ','off');return false}
  try{
    const r=await fetch(API,{headers:headers()});const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Không kết nối được Cloudflare');
    if(!d.state){revision=0;baseState=clone(S);dirty=true;return await cloudPush()}
    if(revision===null){
      if(S.updatedAt>0)try{localStorage.setItem('lala-before-cloud',JSON.stringify(S))}catch(e){}
      S=d.state;dirty=false;
    }else if(d.revision>revision){
      S=dirty?mergeValue(baseState||{},S,d.state):d.state;
      dirty=dirty&&!same(S,d.state);
    }
    revision=d.revision;baseState=clone(d.state);
    localStorage.setItem(KEY,JSON.stringify(S));setSync('☁️ Đã đồng bộ','ok');render();
    if(dirty){clearTimeout(pushT);pushT=setTimeout(cloudPush,600)}
    return true;
  }catch(e){setSync('⚠️ '+e.message,'err');return false}
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const dm=s=>{const d=pd(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
const dow=s=>DAYS[pd(s).getDay()];
const fmtK=n=>n==null?'Hỏi bếp':n.toLocaleString('vi-VN')+'k';
const money=n=>Math.round(n).toLocaleString('vi-VN')+'k';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000)}
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast('Đã copy ✔'),()=>fallbackCopy(t));if(!navigator.clipboard)fallbackCopy(t)}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Đã copy ✔')}catch(e){toast('Không copy được')}a.remove()}
const priceOf=c=>PRICE[c.pack+'|'+c.meal+'|'+c.days]??null;
const dates=()=>Object.keys(S.menu).sort();
function todayISO(){return iso(new Date())}
function defaultDay(){const t=todayISO(),ds=dates();return ds.find(d=>d>=t)||ds[ds.length-1]}
function lockInfo(day){ // chọn trước 17:00 hôm trước
  const d=pd(day);d.setDate(d.getDate()-1);d.setHours(17,0,0,0);return new Date()>d}
function nextDeadline(){const n=new Date();const d=new Date(n);d.setDate(n.getDate()+((7-n.getDay())%7));d.setHours(12,0,0,0);if(d<n)d.setDate(d.getDate()+7);return d}
function countdown(){const ms=nextDeadline()-new Date();const h=Math.floor(ms/36e5);const dd=Math.floor(h/24);return dd>0?`${dd} ngày ${h%24} giờ`:`${h} giờ`}
const dishesOf=day=>{const m=S.menu[day]||{};return SLOT_DEF.map(s=>({...s,name:(m[s.k]||'').trim()}))};
const ordersOf=day=>S.orders.filter(x=>x.date===day);
const people=()=>[...new Set([...S.combos.map(c=>c.name),...S.orders.map(x=>x.name)])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'vi'));

   <div class="tw"><table><thead><tr><th>Gói</th><th>Bữa</th><th>Số ngày</th><th>Tổng</th><th>Giá/bữa</th></tr></thead><tbody>${PRICE_ROWS.map(r=>`<tr><td>${r.p}</td><td>${r.m}</td><td>${r.d}</td><td><b>${r.v}k</b></td><td>${+(r.v/r.d/(r.m==='Trưa'?1:2)).toFixed(1)}k</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g2">
   <div class="card"><h2>Quy định đặt món</h2><ul style="padding-left:18px;margin:8px 0 0;display:grid;gap:6px">
     <li>Mỗi tuần một thực đơn khác, bếp gửi menu vào <b>thứ Bảy</b>.</li><li>Báo chốt trước <b>12h trưa Chủ nhật</b>.</li>
     <li>Mỗi ngày 2 lựa chọn: Menu Chay và Menu Mặn (trưa, tối là 2 món khác nhau).</li>
     <li>Báo OFF trước ít nhất 1 ngày hoặc buổi tối hôm trước; đột xuất (bệnh, công tác) nhận off trước <b>8h30 sáng</b>, không hỗ trợ off đột xuất sáng thứ 6.</li>
     <li>Bảo lưu phần ăn tối đa 30 ngày. Chuyển khoản nhớ ghi tên Facebook + SĐT và gửi ảnh chụp màn hình.</li>
     <li>Liên hệ: ${esc(S.settings.kitchen)} · ${esc(S.settings.kitchenPhone)} · lalasalad.com</li></ul></div>
   <div class="card"><h2>Chính sách bảo lưu</h2><p class="hint">Bấm để phóng to</p><img class="menu-img" src="images/chinh-sach.jpg" alt="Chính sách bảo lưu LaLa Salad" data-act="zoom" data-src="images/chinh-sach.jpg"></div>
  </div>`;
}

function vData(){
  const s=S.settings;const f=(id,l,v,ph='',t='text')=>`<div><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" placeholder="${ph}" data-chg="setSetting" data-k="${id.slice(2)}"></div>`;
  return head('Dữ liệu & cài đặt','Thông tin giao hàng, đồng bộ và sao lưu')+`
  <div class="card" style="margin-bottom:16px"><h2>Thông tin giao hàng</h2><div class="row" style="margin-top:8px">
    ${f('s_contact','Người liên hệ',s.contact,'Tên người đại diện')}${f('s_phone','Số điện thoại',s.phone,'09xx…','tel')}${f('s_address','Địa chỉ giao',s.address,'Toà nhà / số nhà…')}${f('s_time','Giờ nhận',s.time,'11:30','time')}${f('s_start','Ngày bắt đầu',s.start,'','date')}</div></div>
  <div class="card" style="margin-bottom:16px"><h2>Dữ liệu được lưu như thế nào?</h2>
   <p class="hint">Nhập mã nhóm một lần trên mỗi máy. Dữ liệu đơn hàng và menu được lưu chung trên Cloudflare, tự đồng bộ khoảng 15 giây. Nếu chưa nhập mã, thay đổi chỉ lưu trong trình duyệt này.</p>
   <label for="groupToken">Mã truy cập nhóm</label>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="groupToken" type="password" style="flex:1;min-width:240px" placeholder="Dán mã nhóm" value="${esc(token())}" autocomplete="off"><button class="btn" data-act="connectCloud">Kết nối Cloudflare</button><button class="btn ghost" data-act="syncNow">Đồng bộ ngay</button></div>
   <p class="credit">Chỉ chia sẻ mã này cho người cần xem và sửa đơn hàng. Nếu trước đây bạn đã nhập dữ liệu trên máy này, hãy kết nối từ chính trình duyệt đó trước để đưa dữ liệu lên Cloudflare.</p></div>
   <div class="card"><h2>Sao lưu / khôi phục</h2><p class="hint">Xuất file JSON để lưu hoặc chuyển sang máy khác. Khi đã kết nối Cloudflare, nhập JSON hoặc đặt lại dữ liệu sẽ ảnh hưởng đến cả nhóm.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="export">⬇️ Xuất JSON</button><label class="btn ghost" style="margin:0;cursor:pointer">⬆️ Nhập JSON<input type="file" accept="application/json" hidden data-chg="import"></label><button class="btn ghost" data-act="theme">🌓 Đổi giao diện sáng/tối</button><button class="btn danger" data-act="reset">Xoá & về dữ liệu mẫu</button></div>
   <p class="credit" style="margin-top:14px">Ảnh món là minh hoạ SVG tự vẽ theo nguyên liệu. Muốn dùng ảnh AI/ảnh thật: thả <code>images/dishes/&lt;tên-món&gt;.jpg</code> vào repo (xem <code>PROMPTS.md</code>), web tự ưu tiên ảnh thật.</p></div>`;
}

/* ====================== HÀNH ĐỘNG ====================== */
const act={
  pickDay(d){curDay=d.day;if(tab!=='order'){tab='order';location.hash='order'}render()},
  addOrder(d){
    const name=$('#oName').value.trim();if(!name){toast('Nhập họ tên trước nhé');$('#oName').focus();return}
    const ex=S.orders.find(x=>x.date===curDay&&x.name===name);
    const rec=o(curDay,name,d.dish,$('#oNote').value.trim());
    if(ex){ex.dish=rec.dish;if(rec.note)ex.note=rec.note;toast('Đã đổi món cho '+name)}else{S.orders.push(rec);toast('Đã thêm '+name+' ✔')}
    try{localStorage.setItem('lala-me',name)}catch(e){}
    save();const keep=name;render();$('#oName').value=keep;
  },
  delOrder(d){S.orders=S.orders.filter(x=>x.id!==d.id);save();render()},
  copyDay(){
    const od=ordersOf(curDay),sum={};od.forEach(x=>sum[x.dish]=(sum[x.dish]||0)+1);
    copy(`Đơn ${dow(curDay)} ${dm(curDay)} – ${od.length} suất\n`+Object.entries(sum).map(([k,v])=>`• ${v} × ${k}`).join('\n')+'\n\n'+od.map((x,i)=>`${i+1}. ${x.name} – ${x.dish}${x.note?` (${x.note})`:''}`).join('\n'))
  },
  addCombo(){
    const name=$('#cName').value.trim();if(!name){toast('Nhập họ tên');return}
    S.combos.push({id:uid(),name,pack:$('#cPack').value,kind:$('#cKind').value,meal:$('#cMeal').value,days:+$('#cDays').value,note:$('#cNote').value.trim(),paid:false});
    save();render();toast('Đã thêm '+name);
  },
  delCombo(d){S.combos=S.combos.filter(c=>c.id!==d.id);save();render()},
  togglePaid(d,el){const c=S.combos.find(c=>c.id===d.id);c.paid=el.checked;save();render()},
  copyCombo(){copy(comboMsg())},
  setMenu(d,el){(S.menu[d.day]=S.menu[d.day]||{})[d.slot]=el.value.trim();save();toast('Đã lưu menu')},
  addWeek(){
    const ds=dates();let d=pd(ds[ds.length-1]);
    for(let i=0;i<5;){d.setDate(d.getDate()+1);if(d.getDay()>0&&d.getDay()<6){S.menu[iso(d)]={};i++}}
    save();render();
  },
  delDay(d){if(confirm('Xoá ngày '+dm(d.day)+' và các đơn của ngày này?')){delete S.menu[d.day];S.orders=S.orders.filter(x=>x.date!==d.day);save();render()}},
  setSetting(d,el){S.settings[d.k]=el.value.trim();save();toast('Đã lưu')},
  connectCloud(){
    const value=$('#groupToken').value.trim();
    if(!value){toast('Hãy nhập mã nhóm');return}
    localStorage.setItem(TOKEN_KEY,value);revision=null;baseState=null;
    cloudPull(true).then(ok=>toast(ok?'Đã kết nối Cloudflare':'Không kết nối được — kiểm tra mã nhóm'));
  },
  syncNow(){cloudPull(true).then(ok=>toast(ok?'Đã đồng bộ':'Chưa đồng bộ được'))},
  export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='lala-order-'+todayISO()+'.json';a.click()},
  import(d,el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.menu||!j.orders)throw 0;S=j;save();render();toast('Đã nhập dữ liệu')}catch(e){toast('File không hợp lệ')}})},
  reset(){if(confirm(token()?'Xoá toàn bộ dữ liệu chung của cả nhóm và về dữ liệu mẫu?':'Xoá toàn bộ dữ liệu trên máy này và về dữ liệu mẫu?')){S=seed();save();render()}},
  theme(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('lala-theme',r.dataset.theme)}catch(e){}},
  zoom(d){$('#dlgImg').src=d.src;$('#dlg').showModal()}
};
$('#dlg').addEventListener('click',()=>$('#dlg').close());
try{const t=localStorage.getItem('lala-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
load();render();probeImages();cloudPull(true);
</script>
</body>
